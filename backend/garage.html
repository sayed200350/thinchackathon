<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="referrer" content="no-referrer">
  <title>Send a garage quote · Policy Replay</title>
  <style>
    :root { color-scheme:light; --ink:#172923; --muted:#54635c; --line:#ced7cf; --accent:#215539; font:16px/1.5 Inter,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f7f8f5; color:var(--ink); }
    header { border-bottom:1px solid var(--line); background:#fff; }
    nav { max-width:760px; margin:auto; min-height:66px; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { font-size:20px; font-weight:720; letter-spacing:-.055em; }
    .product, .hint { color:var(--muted); font-size:14px; }
    main { max-width:560px; margin:clamp(32px,8vh,78px) auto; padding:0 20px; }
    h1 { font:normal clamp(37px,8vw,54px)/1.05 Georgia,serif; letter-spacing:-.045em; margin:0 0 16px; }
    p { margin:0 0 14px; }
    .panel { background:#fff; padding:clamp(18px,4vw,28px); border:1px solid var(--line); border-radius:12px; }
    form { display:grid; gap:10px; }
    input, button { font:inherit; }
    input[type=file] { display:block; width:100%; min-width:0; }
    input::file-selector-button, button { font:inherit; font-weight:600; padding:10px 14px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:7px; cursor:pointer; }
    input::file-selector-button { margin-right:8px; }
    button[type=submit] { color:#fff; background:var(--accent); border-color:var(--accent); }
    button:disabled { opacity:.5; cursor:default; }
    :focus-visible { outline:3px solid #26754a; outline-offset:3px; }
    a { color:var(--accent); text-underline-offset:.18em; }
    details { margin:18px 0 0; border-top:1px solid var(--line); padding-top:12px; }
    summary { cursor:pointer; font-weight:600; }
    .samples { display:grid; gap:8px; margin:8px 0; }
    .sample-row { display:flex; align-items:center; flex-wrap:wrap; gap:5px 14px; }
    .sample-row a { font-size:14px; }
    #selection { font-weight:600; overflow-wrap:anywhere; margin:2px 0; }
    .error { color:#922f1e; margin:0; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <header><nav aria-label="Service"><span class="brand">Policy Replay</span><span class="product">Garage upload</span></nav></header>
  <main>
    <h1 id="title" tabindex="-1">Opening upload link…</h1>
    <p id="intro" aria-live="polite"></p>
    <section class="panel" id="upload-panel" hidden>
      <form id="upload-form">
        <label for="pdf"><strong>Choose quote PDF</strong></label>
        <span class="hint" id="limit">PDF · up to 2 MiB</span>
        <input type="file" id="pdf" accept="application/pdf,.pdf" aria-describedby="limit">
        <div id="examples" hidden>
          <details open>
            <summary>Sample quotes for this demo</summary>
            <div class="samples">
              <div class="sample-row">
                <button type="button" data-example="itemized-890.pdf">Use €890 example</button>
                <a href="/examples/quotes/itemized-890.pdf" aria-label="€890 itemized PDF" download="itemized-890.pdf">Download PDF</a>
              </div>
              <div class="sample-row">
                <button type="button" data-example="itemized-1800.pdf">Use €1,800 example</button>
                <a href="/examples/quotes/itemized-1800.pdf" aria-label="€1,800 itemized PDF" download="itemized-1800.pdf">Download PDF</a>
              </div>
            </div>
          </details>
        </div>
        <p class="hint" aria-live="polite" id="selection"></p>
        <p class="error" role="alert" id="error" hidden></p>
        <button type="submit" id="send" disabled>Send quote</button>
      </form>
    </section>
    <button id="retry" type="button" hidden>Try again</button>
  </main>
  <script>
    'use strict';
    const get = id => document.getElementById(id);
    const token = new URLSearchParams(location.hash.slice(1)).get('upload');
    const picker = get('pdf');
    const send = get('send');
    let selected = null;
    let sending = false;
    let choice = 0;

    async function post(action, body) {
      const result = await fetch('/api/garage/' + action, {
        method:'POST', cache:'no-store', referrerPolicy:'no-referrer',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
      });
      if (!result.ok) {
        const problem = new Error('The garage upload service could not complete this request.');
        problem.status = result.status;
        throw problem;
      }
      return result.json();
    }

    function view(title, message, open = false) {
      get('title').textContent = title;
      get('intro').textContent = message;
      get('upload-panel').hidden = !open;
      get('retry').hidden = true;
      if (!open) { ++choice; selected = null; picker.value = ''; }
    }

    function unavailable() {
      view('Upload link unavailable', 'Ask the person who sent this link for a new garage upload request.');
    }

    function received() {
      view('Quote received', 'Your PDF has been added to the claim. You can close this page.');
    }

    async function open() {
      if (!token) return unavailable();
      get('retry').hidden = true;
      try {
        const result = await post('status', {token});
        if (result.status === 'received') return received();
        if (result.status === 'closed') return unavailable();
        if (result.status !== 'open') throw new Error('Unexpected status');
        view('Send an itemized quote', 'Include the repair work, the cost of each item, and the final total.', true);
        get('examples').hidden = result.demo !== true;
      } catch (error) {
        if ([400,403,404,410].includes(error.status)) return unavailable();
        view('Couldn’t open the upload', 'Check your connection, then try again.');
        get('retry').hidden = false;
      }
    }

    function showError(message) {
      get('error').textContent = message;
      get('error').hidden = !message;
    }

    function beginChoice(message = '') {
      selected = null;
      send.disabled = true;
      showError('');
      get('selection').textContent = message;
      return ++choice;
    }

    async function stage(file, current) {
      if (!file || current !== choice) return;
      get('selection').textContent = '';
      if (!/\.pdf$/i.test(file.name) || file.size < 5 || file.size > 2 * 1024 * 1024)
        return showError('Choose a PDF up to 2 MiB.');
      try {
        const header = await file.slice(0, 5).text();
        if (current !== choice) return;
        if (header !== '%PDF-') return showError('Choose a readable PDF file.');
        selected = file;
        send.disabled = false;
        get('selection').textContent = 'Ready to send · ' + file.name;
      } catch {
        if (current === choice) showError('Couldn’t read that file. Choose the PDF again.');
      }
    }

    picker.addEventListener('change', () => stage(picker.files[0], beginChoice()));

    for (const example of document.querySelectorAll('[data-example]')) {
      example.addEventListener('click', async () => {
        if (sending || get('examples').hidden) return;
        const current = beginChoice('Opening example PDF…');
        const name = example.dataset.example;
        picker.value = '';
        try {
          const response = await fetch('/examples/quotes/' + name, {credentials:'omit', referrerPolicy:'no-referrer'});
          if (!response.ok) throw new Error('Example unavailable');
          const file = new File([await response.blob()], name, {type:'application/pdf'});
          if (current !== choice) return;
          // Mirror the staged example in browsers with a writable native file picker.
          try {
            const files = new DataTransfer();
            files.items.add(file);
            picker.files = files.files;
          } catch {
            // The selected filename below also works on older mobile browsers.
          }
          await stage(file, current);
        } catch {
          if (current === choice) {
            get('selection').textContent = '';
            showError('Couldn’t open the example. Try again or choose a PDF from your device.');
          }
        }
      });
    }

    function encode(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    get('upload-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (!selected || sending) return;
      sending = picker.disabled = send.disabled = true;
      send.textContent = 'Sending…';
      showError('');
      try {
        const document = {kind:'itemized_quote', name:selected.name, content_base64:await encode(selected)};
        const result = await post('upload', {token, document});
        if (result.status !== 'received') throw new Error('Unexpected status');
        received();
      } catch (error) {
        if ([403,404,409,410].includes(error.status)) {
          await open();
        }
        if (!get('upload-panel').hidden)
          showError('The upload could not be confirmed. Check your connection and send the same PDF again.');
      } finally {
        sending = picker.disabled = false;
        send.disabled = !selected;
        send.textContent = 'Send quote';
      }
    });
    get('retry').addEventListener('click', open);
    window.addEventListener('hashchange', () => location.reload());
    open();
  </script>
</body>
</html>
