<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta name="referrer" content="no-referrer" />
    <title>Report a motor claim · Policy Replay</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172923;
        --muted: #54635c;
        --line: #ced7cf;
        --paper: #fff;
        --ground: #f7f8f5;
        --accent: #215539;
        --pale: #e6f0e7;
        --error: #922f1e;
        font:
          16px/1.5 'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--ground);
        margin: 0;
        color: var(--ink);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.56;
        cursor: wait;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 3px solid #26754a;
        outline-offset: 3px;
      }
      .top {
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        max-width: 1180px;
        min-height: 70px;
        margin: auto;
        padding: 0 clamp(20px, 5vw, 72px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .wordmark {
        font-weight: 740;
        font-size: 20px;
        letter-spacing: -0.055em;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .mark {
        width: 21px;
        height: 22px;
        display: inline-block;
        background:
          linear-gradient(
            90deg,
            transparent 0 25%,
            var(--accent) 25% 46%,
            transparent 46%
          ),
          linear-gradient(var(--accent), var(--accent)) top right/75% 4px
            no-repeat,
          linear-gradient(var(--accent), var(--accent)) 80% 47%/63% 4px
            no-repeat,
          linear-gradient(var(--accent), var(--accent)) bottom left/85% 4px
            no-repeat;
        transform: skewY(-8deg);
      }
      .product {
        font-size: 14px;
        color: var(--muted);
      }
      .layout {
        max-width: 1180px;
        margin: 0 auto;
        padding: clamp(30px, 6vw, 74px) clamp(20px, 5vw, 72px) 70px;
        display: grid;
        grid-template-columns: minmax(190px, 260px) minmax(0, 1fr);
        gap: clamp(34px, 7vw, 105px);
        align-items: start;
      }
      .side {
        position: sticky;
        top: 32px;
      }
      h1 {
        font:
          normal clamp(37px, 4vw, 58px) / 1.02 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.055em;
        margin: 0 0 18px;
        max-width: 7em;
      }
      .sub {
        margin: 0;
        color: var(--muted);
        max-width: 29ch;
      }
      .stages {
        list-style: none;
        padding: 0;
        margin: 38px 0 0;
        display: grid;
        gap: 14px;
      }
      .stage {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: var(--muted);
      }
      .stage[aria-current='step'] {
        color: var(--ink);
        font-weight: 650;
      }
      .dot {
        border: 1px solid #a1b1a5;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        display: block;
      }
      .stage.active .dot {
        background: var(--accent);
        border-color: var(--accent);
        outline: 1px solid var(--accent);
        outline-offset: 3px;
      }
      .stage.done .dot {
        background: var(--accent);
        border-color: var(--accent);
      }
      .chat {
        min-width: 0;
      }
      .log {
        display: grid;
        gap: 16px;
      }
      .past {
        margin: 0;
        padding: 0 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .past small {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }
      .past p {
        margin: 5px 0 0;
        font-size: 16px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 16px;
        padding: clamp(20px, 3vw, 34px);
        scroll-margin: 20px;
      }
      .log:not(:empty) {
        margin-bottom: 24px;
      }
      h2 {
        font:
          normal clamp(26px, 3.1vw, 39px) / 1.12 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.04em;
        margin: 0 0 12px;
      }
      .help {
        color: var(--muted);
        margin: 0 0 22px;
      }
      form {
        margin: 0;
      }
      .label {
        display: block;
        margin: 14px 0 6px;
        font-size: 14px;
        font-weight: 650;
      }
      input,
      textarea,
      select {
        color: var(--ink);
        background: #fff;
        border: 1px solid #94a79a;
        border-radius: 7px;
        max-width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        width: 100%;
      }
      textarea {
        resize: vertical;
        min-height: 104px;
      }
      input[type='file'] {
        padding: 7px;
      }
      input::file-selector-button {
        border: 1px solid var(--line);
        background: var(--ground);
        color: var(--ink);
        font: inherit;
        border-radius: 4px;
        padding: 5px 9px;
        margin-right: 10px;
        cursor: pointer;
      }
      .actions,
      .choices {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 18px;
      }
      .btn {
        border: 1px solid var(--line);
        padding: 10px 16px;
        border-radius: 7px;
        min-height: 44px;
        background: var(--paper);
        color: var(--ink);
        font-weight: 600;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--pale);
      }
      .btn.primary {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .btn.primary:hover:not(:disabled) {
        background: #153f29;
      }
      .btn.quiet {
        border: 0;
        background: transparent;
        padding: 5px 8px;
        font-size: 14px;
        font-weight: 550;
        text-decoration: underline;
        text-underline-offset: 3px;
        min-height: 40px;
      }
      .files,
      .review {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
      }
      .file,
      .field {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding: 11px 0;
      }
      .field div,
      .file div {
        min-width: 0;
      }
      .field dt,
      .file small {
        color: var(--muted);
        font-size: 13px;
      }
      .field dd,
      .file span {
        margin: 3px 0 0;
        display: block;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .file .quiet,
      .field .quiet {
        flex: none;
      }
      .docs-area {
        display: grid;
        gap: 8px;
      }
      .error {
        color: var(--error);
        font-size: 14px;
        margin: 12px 0 0;
      }
      #filing-help {
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: clamp(20px, 5vw, 32px);
        width: min(94vw, 33rem);
        max-height: 88dvh;
        overflow-y: auto;
      }
      #filing-help::backdrop {
        background: rgb(14 32 24 / 42%);
      }
      .help-exchange {
        background: var(--pale);
        padding: 14px 16px;
        margin: 0 0 18px;
        border-radius: 8px;
        overflow-wrap: anywhere;
      }
      .help-exchange p {
        margin: 0;
      }
      .help-exchange p + p {
        margin-top: 8px;
      }
      .ask-link {
        color: var(--accent);
      }
      .reference {
        font:
          600 clamp(17px, 3vw, 25px) / 1.4 ui-monospace,
          monospace;
        overflow-wrap: anywhere;
        letter-spacing: 0.025em;
        margin: 4px 0 16px;
      }
      .sr {
        position: absolute;
        clip-path: inset(50%);
        width: 1px;
        height: 1px;
        overflow: hidden;
        white-space: nowrap;
      }
      .review h3 {
        font-size: 17px;
        margin: 18px 0 4px;
      }
      @media (max-width: 720px) {
        .bar {
          min-height: 56px;
        }
        .layout {
          display: block;
          padding-top: 25px;
        }
        .side {
          position: static;
          margin: 0 0 22px;
        }
        h1 {
          font-size: 37px;
          margin: 0 0 8px;
          max-width: none;
        }
        .sub {
          max-width: none;
          font-size: 15px;
        }
        .stages {
          display: flex;
          flex-wrap: wrap;
          gap: 8px 14px;
          margin: 17px 0 0;
        }
        .stage {
          font-size: 12px;
          gap: 7px;
        }
        .dot {
          width: 7px;
          height: 7px;
        }
        .stage.active .dot {
          outline-offset: 1px;
        }
        .card {
          border-radius: 12px;
        }
        .log {
          gap: 10px;
        }
        .past {
          padding-bottom: 10px;
        }
        .field,
        .file {
          align-items: flex-start;
        }
        .btn {
          min-height: 44px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .card {
          animation: appear 0.18s ease-out;
        }
        @keyframes appear {
          from {
            opacity: 0.65;
            transform: translateY(3px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
      .drop-zone {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        border: 1px dashed #87a795;
        background: #f2f7f2;
        padding: 28px 18px;
        border-radius: 11px;
        text-align: center;
      }
      .opening-image {
        display:block; max-width:100%; width:auto; max-height:44vh; margin:12px auto 20px;
        background:var(--ground); border:1px solid var(--line); border-radius:8px;
      }
      .drop-zone.over {
        background: #deefdf;
        border-color: var(--accent);
      }
      .upload-icon {
        font-size: 28px;
        line-height: 1;
        color: var(--accent);
      }
      .sample {
        display: inline-block;
        font-size: 14px;
        color: var(--accent);
        margin-top: 16px;
      }
      .file-hint,
      .citation {
        color: var(--muted);
        font-size: 14px;
      }
      .citation {
        display: block;
        margin: 4px 0 8px;
        overflow-wrap: anywhere;
      }
      .previous {
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        padding: 6px 0;
      }
      .suggestion {
        margin-top: 15px;
      }
      .suggestion .choices {
        margin-top: 7px;
      }
      .suggestion .choices button {
        max-width: 100%;
        overflow-wrap: anywhere;
        text-align: left;
      }
      .thumb {
        width: 65px;
        height: 65px;
        border-radius: 6px;
        object-fit: contain;
        background: var(--ground);
        flex: none;
      }
      .file {
        flex-wrap: wrap;
      }
      .file-info {
        flex: 1 1 115px;
      }
      .evidence-note, .photo-detail, .assistance-panel {
        flex: 1 0 100%;
        min-width: 0;
        overflow-wrap: anywhere;
        margin: 12px 0;
        border-left: 3px solid var(--line);
        padding: 6px 14px;
      }
      .evidence-note h3, .evidence-note p { margin: 4px 0 8px; }
      .sample-docs { margin: 14px 0; }
      .sample-links { display: flex; flex-wrap: wrap; gap: 4px 18px; }
      .sample-docs a { color: var(--accent); }
      .photo-guide img { max-width: 100%; height: auto; }
      .file-buttons {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
      }
      .checklist {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .checklist li {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
        font-size: 14px;
        border-bottom: 1px solid var(--line);
        padding: 6px 0;
      }
      .checklist strong {
        font-weight: 550;
      }
      .checklist .present span {
        color: var(--accent);
      }
      .checklist .missing span {
        color: #78500c;
      }
      .photo-actions {
        margin-top: 7px;
      }
      .save-bar,
      .follow-up {
        border-top: 1px solid var(--line);
        margin-top: 22px;
        padding-top: 10px;
      }
      .save-bar > button {
        padding-left: 0;
      }
      .link-panel {
        margin: 14px 0;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 14px;
        background: var(--ground);
      }
      .link-panel p {
        margin: 4px 0 9px;
      }
      .garage-share img {
        display:block; width:min(320px, 100%); aspect-ratio:1; margin:12px 0;
        border:1px solid var(--line); background:white;
      }
      .garage-share input { margin:6px 0; }
      #garage-projector {
        width:min(94vw, 760px); max-height:96vh; padding:clamp(12px, 3vw, 28px);
        border:1px solid var(--line); border-radius:12px; color:var(--ink);
      }
      #garage-projector::backdrop { background:rgba(11, 24, 17, .78); }
      .projector-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
      .projector-head h2 { margin:0; }
      #projected-code { display:block; width:min(100%, 69vh); aspect-ratio:1; margin:8px auto; }
      #projected-garage-link { display:block; text-align:center; color:var(--accent); }
      .link-panel input {
        font-size: 13px;
      }
      @media (max-width: 480px) {
        .file-buttons {
          flex-basis: 100%;
        }
      }
    </style>
  </head>
  <body data-voice-agent="">
    <header class="top">
      <div class="bar">
        <span class="wordmark"
          ><span class="mark" aria-hidden="true"></span>Policy Replay</span
        ><span class="product">Motor claims</span>
      </div>
    </header>
    <main class="layout">
      <aside class="side">
        <h1>Report a motor claim</h1>
        <p class="sub">
          Start with a photo or report, or tell us what happened.
        </p>
        <ol class="stages" id="stages" aria-label="Claim progress"></ol>
      </aside>
      <section class="chat" aria-label="Claim intake conversation">
        <div class="log" id="history" aria-label="Your answers"></div>
        <div id="current"></div>
        <p id="announce" class="sr" role="status"></p>
      </section>
    </main>
    <dialog id="garage-projector" aria-labelledby="projector-title">
      <div class="projector-head">
        <h2 id="projector-title">Scan to send a garage quote</h2>
        <form method="dialog"><button class="btn" autofocus>Close</button></form>
      </div>
      <img id="projected-code" alt="Garage upload QR code">
      <a id="projected-garage-link" target="_blank" rel="noreferrer noopener">Open garage upload</a>
    </dialog>
    <dialog id="filing-help" aria-labelledby="help-title">
      <h2 id="help-title">Ask about filing your claim</h2>
      <div id="help-exchange" class="help-exchange" hidden>
        <p><strong id="asked-question"></strong></p>
        <p id="filing-reply" tabindex="-1"></p>
      </div>
      <form id="help-form">
        <label class="label" for="filing-question">Your question</label>
        <input id="filing-question" type="text" maxlength="1000" required
          placeholder="Can I send the repair quote later?" autocomplete="off" />
        <div class="actions">
          <button type="submit" class="btn primary" id="send-question">Ask</button>
          <button type="button" class="btn" id="close-help">Back to claim</button>
        </div>
      </form>
      <button type="button" id="keep-answer" class="btn quiet" hidden>Use this text as my claim answer</button>
    </dialog>
    <script src="/assets/claim_assistance.js"></script>
    <script>
      'use strict';
      const fields = [
        {
          key: 'description',
          label: 'What happened',
          prompt: 'What happened to your vehicle?',
          hint: 'Describe the incident and any damage you noticed.',
          type: 'textarea',
          min: 10,
          max: 2000
        },
        {
          key: 'incident_date',
          label: 'Incident date',
          prompt: 'When did the incident happen?',
          hint: 'Enter the date of the incident.',
          type: 'date'
        },
        {
          key: 'location',
          label: 'Incident location',
          prompt: 'Where did it happen?',
          hint: 'A street, town or nearby landmark works.',
          type: 'text',
          max: 160
        },
        {
          key: 'policy_number',
          label: 'Policy number',
          prompt: 'What is your policy number?',
          hint: 'You can find this on your insurance documents.',
          type: 'text',
          max: 80
        },
        {
          key: 'email',
          label: 'Contact email',
          prompt: 'Which email can the claims team use?',
          hint: 'Enter the address you use for claim updates.',
          type: 'email',
          max: 254
        },
        {
          key: 'injury_status',
          label: 'Injuries reported',
          prompt: 'Was anyone injured?',
          hint: 'If you are unsure, choose “I don’t know.”',
          type: 'choice'
        }
      ];
      const kinds = {
        incident_report: 'Incident report',
        itemized_quote: 'Itemized repair quote',
        damage_photo: 'Damage photo'
      };
      const injuries = { yes: 'Yes', no: 'No', unknown: 'I don’t know' };
      const names = ['Incident', 'Claim details', 'Documents', 'Review'];
      const docsStep = fields.length;
      const reviewStep = docsStep + 1;
      const welcomeStep = -1;
      const importStep = -2;
      const receiptStep = -3;
      const requiredKinds = ['incident_report', 'itemized_quote'];
      const maxFiles = 4;
      const maxImageBytes = 12 * 1024 * 1024;
      const maxBytes = 2 * 1024 * 1024;
      const intakeFormats = '.pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png';
      const historyEl = document.querySelector('#history');
      const current = document.querySelector('#current');
      const stages = document.querySelector('#stages');
      let demoCase = null;
      let step = welcomeStep;
      let editing = false;
      let values = {};
      let sources = {};
      let partialAnswer = '';
      let files = [];
      let importResult = null;
      let importFile = null;
      let revision = 0;
      let token = '';
      let requestId = '';
      let receipt = null;
      let pending = null;
      let busy = false;
      let saveNotice = false;
      let conflict = false;
      let garageRequest = null;
      let issuingGarageLink = false;
      let checkingReceipt = false;

      function el(tag, cls, text) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function button(text, cls, action) {
        const node = el('button', 'btn ' + cls, text);
        node.type = 'button';
        node.addEventListener('click', () => {
          if (!busy) action();
        });
        return node;
      }

      function today() {
        const parts = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Europe/Berlin',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).formatToParts(new Date());
        const part = (key) => parts.find((p) => p.type === key).value;
        return [part('year'), part('month'), part('day')].join('-');
      }

      function uid() {
        if (crypto.randomUUID) return crypto.randomUUID();
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        bytes[6] = (bytes[6] & 15) | 64;
        bytes[8] = (bytes[8] & 63) | 128;
        const hex = hexString(bytes);
        return [
          hex.slice(0, 8),
          hex.slice(8, 12),
          hex.slice(12, 16),
          hex.slice(16, 20),
          hex.slice(20)
        ].join('-');
      }

      function hexString(bytes) {
        return Array.from(bytes, (byte) =>
          byte.toString(16).padStart(2, '0')
        ).join('');
      }

      function privateToken() {
        if (!token)
          token = hexString(crypto.getRandomValues(new Uint8Array(32)));
        return token;
      }

      function privateURL() {
        const url = new URL('/chat', location.origin);
        url.hash = 'claim=' + token;
        return url.href;
      }

      function status(text) {
        document.getElementById('announce').textContent = text;
      }

      function heading(card, title, help) {
        const titleEl = el('h2', '', title);
        titleEl.id = 'question-title';
        titleEl.tabIndex = -1;
        card.append(titleEl);
        if (help) card.append(el('p', 'help', help));
      }

      function showError(text) {
        const err = current.querySelector('[role=alert]');
        if (!err) return;
        err.textContent = text;
        err.hidden = !text;
      }

      function row(label, value, action) {
        const item = el('div', 'field');
        const details = el('div');
        details.append(el('dt', '', label), el('dd', '', value));
        item.append(details);
        if (action) {
          const edit = button('Edit', 'quiet', action);
          edit.setAttribute('aria-label', 'Edit ' + label);
          item.append(edit);
        }
        return item;
      }

      function setStep(next, isEdit = false) {
        step = next;
        editing = isEdit;
        partialAnswer = '';
        saveNotice = false;
        render(true);
      }

      function nextUnanswered() {
        const index = fields.findIndex((field) => !values[field.key]);
        return index === -1 ? docsStep : index;
      }

      function setBusy(value) {
        busy = value;
        current.setAttribute('aria-busy', String(value));
        current.inert = value;
      }

      async function api(path, body, base = '/api/intakes/') {
        const resp = await fetch(base + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          cache: 'no-store',
          referrerPolicy: 'no-referrer'
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) {
          const error = new Error(
            typeof data?.error === 'string'
              ? data.error
              : 'Could not complete this request.'
          );
          error.status = resp.status;
          throw error;
        }
        if (!data || typeof data !== 'object')
          throw new Error('Could not read the response.');
        return data;
      }

      function fieldInput(field, id) {
        const node = el(field.type === 'textarea' ? 'textarea' : 'input');
        node.id = id;
        node.name = field.key;
        if (field.type !== 'textarea') node.type = field.type;
        if (field.type === 'email')
          node.pattern = '[^\\s@]+@[^\\s@.]+([.][^\\s@.]+)+';
        if (field.type === 'date') node.max = today();
        if (field.min) node.minLength = field.min;
        if (field.max) node.maxLength = field.max;
        node.autocomplete = field.type === 'email' ? 'email' : 'off';
        node.addEventListener('input', () => node.setCustomValidity(''));
        return node;
      }

      function validField(field, node) {
        const value = node.value.trim();
        if (!value || (field.min && value.length < field.min)) {
          node.setCustomValidity(
            field.min
              ? 'Enter at least ' + field.min + ' characters.'
              : 'Enter an answer.'
          );
        }
        return node.reportValidity();
      }

      function validateFile(file, kind = '') {
        if (!file?.size) throw new Error('Choose a non-empty file.');
        if (!file.name.trim() || file.name !== file.name.trim() || file.name.length > 180 ||
            /[\x00-\x1f\x7f-\x9f/\\]/.test(file.name))
          throw new Error('Use a filename up to 180 characters without path separators.');
        const ext = file.name.toLowerCase().split('.').pop();
        const image = ['png', 'jpg', 'jpeg'].includes(ext);
        if (!image && ext !== 'pdf') throw new Error('Choose a PDF, JPEG or PNG file.');
        if (!image && kind === 'damage_photo') throw new Error('Choose a JPEG or PNG damage photo.');
        const limit = image && (!receipt || receipt.evidence) ? maxImageBytes : maxBytes;
        if (file.size > limit) throw new Error('Choose a file up to ' + limit / (1024 * 1024) + ' MiB.');
        return ext;
      }

      async function encodeFile(file, kind) {
        const ext = validateFile(file, kind);
        const header = new Uint8Array(await file.slice(0, 8).arrayBuffer());
        const signature = ext === 'pdf' ? [37,80,68,70,45] :
                          ext === 'png' ? [137,80,78,71,13,10,26,10] : [255,216,255];
        if (!signature.every((byte, index) => header[index] === byte))
          throw new Error('The file contents do not match its extension. Choose the original PDF, JPEG or PNG.');
        const encoded = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(',')[1]);
          reader.onerror = () =>
            reject(
              new Error('The file could not be read. Please choose it again.')
            );
          reader.readAsDataURL(file);
        });
        return { kind, name: file.name, content_base64: encoded };
      }

      function fileButton(container, label, id, accept, onFiles, options = {}) {

        input.multiple = Boolean(options.multiple);
        if (options.camera) input.setAttribute('capture', 'environment');
        const choose = button(label, options.style || '', () => input.click());
        input.addEventListener('change', () => {
          const selected = Array.from(input.files);
          input.value = '';
          if (selected.length && !busy) onFiles(selected);
        });
        container.append(input, choose);
        return choose;
      }

      async function openFile(file) {
        setBusy(true);
        showError('');
        status('Preparing your file.');
        try {
          const doc = await encodeFile(file, '');
          if (!/\.pdf$/i.test(doc.name)) {
            const preview = previewImage(doc);
            try { await preview.decode(); } catch { throw new Error('Couldn’t open the image. Choose the original JPEG or PNG.'); }
            const exifDate = await ClaimAssistance.photoCaptureDate(file);
            importFile = doc;
            importResult = {image:true, exifDate};
            setStep(importStep);
            return;
          }
          importFile = doc;
          try {
            importResult = await api('import-pdf', {
              name: importFile.name,
              content_base64: importFile.content_base64
            });
            if (!Array.isArray(importResult.suggestions))
              throw new Error('Unexpected import response.');
          } catch {
            importResult = {
              suggestions: [],
              document_kind: null,
              notice:
                'We couldn’t read the PDF. You can attach it and enter the answers yourself.'
            };
          }
          if (importResult.document_kind === 'itemized_quote') {
            importFile.kind = 'itemized_quote';
            await assessQuote(importFile);
          }
          setStep(importStep);
        } catch (error) {
          showError(error.message);
        } finally {
          setBusy(false);
          status('');
        }
      }

      function kindSelect(includeBlank) {
        const select = el('select');
        if (includeBlank) select.add(new Option('Choose document type', ''));

      function previewImage(doc, style = 'thumb') {

        image.src = 'data:image/' + (/\.png$/i.test(doc.name) ? 'png' : 'jpeg') +

      }

      function previewQuoteChoice(select, panel) {
        const doc = importFile;
        const update = async () => {
          panel.replaceChildren();
          if (select.value !== 'itemized_quote') return;

            setBusy(true);

              await assessQuote(doc);
            } finally {
              setBusy(false);
            }
          }
          showQuote(panel, doc.assessment);

        update();
        select.addEventListener('change', update);
