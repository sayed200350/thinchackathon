<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta name="referrer" content="no-referrer" />
    <title>Report a motor claim · Policy Replay</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172923;
        --muted: #54635c;
        --line: #ced7cf;
        --paper: #fff;
        --ground: #f7f8f5;
        --accent: #215539;
        --pale: #e6f0e7;
        --error: #922f1e;
        font:
          16px/1.5 'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--ground);
        margin: 0;
        color: var(--ink);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.56;
        cursor: wait;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 3px solid #26754a;
        outline-offset: 3px;
      }
      .top {
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        max-width: 1180px;
        min-height: 70px;
        margin: auto;
        padding: 0 clamp(20px, 5vw, 72px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .wordmark {
        font-weight: 740;
        font-size: 20px;
        letter-spacing: -0.055em;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .mark {
        width: 21px;
        height: 22px;
        display: inline-block;
        background:
          linear-gradient(
            90deg,
            transparent 0 25%,
            var(--accent) 25% 46%,
            transparent 46%
          ),
          linear-gradient(var(--accent), var(--accent)) top right/75% 4px
            no-repeat,
          linear-gradient(var(--accent), var(--accent)) 80% 47%/63% 4px
            no-repeat,
          linear-gradient(var(--accent), var(--accent)) bottom left/85% 4px
            no-repeat;
        transform: skewY(-8deg);
      }
      .product {
        font-size: 14px;
        color: var(--muted);
      }
      .layout {
        max-width: 1180px;
        margin: 0 auto;
        padding: clamp(30px, 6vw, 74px) clamp(20px, 5vw, 72px) 70px;
        display: grid;
        grid-template-columns: minmax(190px, 260px) minmax(0, 1fr);
        gap: clamp(34px, 7vw, 105px);
        align-items: start;
      }
      .side {
        position: sticky;
        top: 32px;
      }
      h1 {
        font:
          normal clamp(37px, 4vw, 58px) / 1.02 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.055em;
        margin: 0 0 18px;
        max-width: 7em;
      }
      .sub {
        margin: 0;
        color: var(--muted);
        max-width: 29ch;
      }
      .stages {
        list-style: none;
        padding: 0;
        margin: 38px 0 0;
        display: grid;
        gap: 14px;
      }
      .stage {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: var(--muted);
      }
      .stage[aria-current='step'] {
        color: var(--ink);
        font-weight: 650;
      }
      .dot {
        border: 1px solid #a1b1a5;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        display: block;
      }
      .stage.active .dot {
        background: var(--accent);
        border-color: var(--accent);
        outline: 1px solid var(--accent);
        outline-offset: 3px;
      }
      .stage.done .dot {
        background: var(--accent);
        border-color: var(--accent);
      }
      .chat {
        min-width: 0;
      }
      .log {
        display: grid;
        gap: 16px;
      }
      .past {
        margin: 0;
        padding: 0 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .past small {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }
      .past p {
        margin: 5px 0 0;
        font-size: 16px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 16px;
        padding: clamp(20px, 3vw, 34px);
        scroll-margin: 20px;
      }
      .log:not(:empty) {
        margin-bottom: 24px;
      }
      h2 {
        font:
          normal clamp(26px, 3.1vw, 39px) / 1.12 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.04em;
        margin: 0 0 12px;
      }
      .help {
        color: var(--muted);
        margin: 0 0 22px;
      }
      form {
        margin: 0;
      }
      .label {
        display: block;
        margin: 14px 0 6px;
        font-size: 14px;
        font-weight: 650;
      }
      input,
      textarea,
      select {
        color: var(--ink);
        background: #fff;
        border: 1px solid #94a79a;
        border-radius: 7px;
        max-width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        width: 100%;
      }
      textarea {
        resize: vertical;
        min-height: 104px;
      }
      input[type='file'] {
        padding: 7px;
      }
      input::file-selector-button {
        border: 1px solid var(--line);
        background: var(--ground);
        color: var(--ink);
        font: inherit;
        border-radius: 4px;
        padding: 5px 9px;
        margin-right: 10px;
        cursor: pointer;
      }
      .actions,
      .choices {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 18px;
      }
      .btn {
        border: 1px solid var(--line);
        padding: 10px 16px;
        border-radius: 7px;
        min-height: 44px;
        background: var(--paper);
        color: var(--ink);
        font-weight: 600;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--pale);
      }
      .btn.primary {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .btn.primary:hover:not(:disabled) {
        background: #153f29;
      }
      .btn.quiet {
        border: 0;
        background: transparent;
        padding: 5px 8px;
        font-size: 14px;
        font-weight: 550;
        text-decoration: underline;
        text-underline-offset: 3px;
        min-height: 40px;
      }
      .files,
      .review {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
      }
      .file,
      .field {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding: 11px 0;
      }
      .field div,
      .file div {
        min-width: 0;
      }
      .field dt,
      .file small {
        color: var(--muted);
        font-size: 13px;
      }
      .field dd,
      .file span {
        margin: 3px 0 0;
        display: block;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .file .quiet,
      .field .quiet {
        flex: none;
      }
      .docs-area {
        display: grid;
        gap: 8px;
      }
      .error {
        color: var(--error);
        font-size: 14px;
        margin: 12px 0 0;
      }
      .reference {
        font:
          600 clamp(17px, 3vw, 25px) / 1.4 ui-monospace,
          monospace;
        overflow-wrap: anywhere;
        letter-spacing: 0.025em;
        margin: 4px 0 16px;
      }
      .sr {
        position: absolute;
        clip-path: inset(50%);
        width: 1px;
        height: 1px;
        overflow: hidden;
        white-space: nowrap;
      }
      .review h3 {
        font-size: 17px;
        margin: 18px 0 4px;
      }
      @media (max-width: 720px) {
        .bar {
          min-height: 56px;
        }
        .layout {
          display: block;
          padding-top: 25px;
        }
        .side {
          position: static;
          margin: 0 0 22px;
        }
        h1 {
          font-size: 37px;
          margin: 0 0 8px;
          max-width: none;
        }
        .sub {
          max-width: none;
          font-size: 15px;
        }
        .stages {
          display: flex;
          flex-wrap: wrap;
          gap: 8px 14px;
          margin: 17px 0 0;
        }
        .stage {
          font-size: 12px;
          gap: 7px;
        }
        .dot {
          width: 7px;
          height: 7px;
        }
        .stage.active .dot {
          outline-offset: 1px;
        }
        .card {
          border-radius: 12px;
        }
        .log {
          gap: 10px;
        }
        .past {
          padding-bottom: 10px;
        }
        .field,
        .file {
          align-items: flex-start;
        }
        .btn {
          min-height: 44px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .card {
          animation: appear 0.18s ease-out;
        }
        @keyframes appear {
          from {
            opacity: 0.65;
            transform: translateY(3px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
      .drop-zone {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        border: 1px dashed #87a795;
        background: #f2f7f2;
        padding: 28px 18px;
        border-radius: 11px;
        text-align: center;
      }
      .drop-zone.over {
        background: #deefdf;
        border-color: var(--accent);
      }
      .upload-icon {
        font-size: 28px;
        line-height: 1;
        color: var(--accent);
      }
      .sample {
        display: inline-block;
        font-size: 14px;
        color: var(--accent);
        margin-top: 16px;
      }
      .file-hint,
      .citation {
        color: var(--muted);
        font-size: 14px;
      }
      .citation {
        display: block;
        margin: 4px 0 8px;
        overflow-wrap: anywhere;
      }
      .previous {
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        padding: 6px 0;
      }
      .suggestion {
        margin-top: 15px;
      }
      .suggestion .choices {
        margin-top: 7px;
      }
      .suggestion .choices button {
        max-width: 100%;
        overflow-wrap: anywhere;
        text-align: left;
      }
      .thumb {
        width: 65px;
        height: 65px;
        border-radius: 6px;
        object-fit: contain;
        background: var(--ground);
        flex: none;
      }
      .file {
        flex-wrap: wrap;
      }
      .file-info {
        flex: 1 1 115px;
      }
      .file-buttons {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
      }
      .checklist {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .checklist li {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
        font-size: 14px;
        border-bottom: 1px solid var(--line);
        padding: 6px 0;
      }
      .checklist strong {
        font-weight: 550;
      }
      .checklist .present span {
        color: var(--accent);
      }
      .checklist .missing span {
        color: #78500c;
      }
      .photo-actions {
        margin-top: 7px;
      }
      .save-bar,
      .follow-up {
        border-top: 1px solid var(--line);
        margin-top: 22px;
        padding-top: 10px;
      }
      .save-bar > button {
        padding-left: 0;
      }
      .link-panel {
        margin: 14px 0;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 14px;
        background: var(--ground);
      }
      .link-panel p {
        margin: 4px 0 9px;
      }
      .link-panel input {
        font-size: 13px;
      }
      @media (max-width: 480px) {
        .file-buttons {
          flex-basis: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="bar">
        <span class="wordmark"
          ><span class="mark" aria-hidden="true"></span>Policy Replay</span
        ><span class="product">Motor claims</span>
      </div>
    </header>
    <main class="layout">
      <aside class="side">
        <h1>Report a motor claim</h1>
        <p class="sub">
          Start with your accident report or tell us what happened.
        </p>
        <ol class="stages" id="stages" aria-label="Claim progress"></ol>
      </aside>
      <section class="chat" aria-label="Claim intake conversation">
        <div class="log" id="history" aria-label="Your answers"></div>
        <div id="current"></div>
        <p id="announce" class="sr" role="status"></p>
      </section>
    </main>
    <script>
      'use strict';
      const fields = [
        {
          key: 'description',
          label: 'What happened',
          prompt: 'What happened to your vehicle?',
          hint: 'Describe the incident and any damage you noticed.',
          type: 'textarea',
          min: 10,
          max: 2000
        },
        {
          key: 'incident_date',
          label: 'Incident date',
          prompt: 'When did the incident happen?',
          hint: 'Enter the date of the incident.',
          type: 'date'
        },
        {
          key: 'location',
          label: 'Incident location',
          prompt: 'Where did it happen?',
          hint: 'A street, town or nearby landmark works.',
          type: 'text',
          max: 160
        },
        {
          key: 'policy_number',
          label: 'Policy number',
          prompt: 'What is your policy number?',
          hint: 'You can find this on your insurance documents.',
          type: 'text',
          max: 80
        },
        {
          key: 'email',
          label: 'Contact email',
          prompt: 'Which email can the claims team use?',
          hint: 'Enter the address you use for claim updates.',
          type: 'email',
          max: 254
        },
        {
          key: 'injury_status',
          label: 'Injuries reported',
          prompt: 'Was anyone injured?',
          hint: 'If you are unsure, choose “I don’t know.”',
          type: 'choice'
        }
      ];
      const kinds = {
        incident_report: 'Incident report',
        itemized_quote: 'Itemized repair quote',
        damage_photo: 'Damage photo'
      };
      const injuries = { yes: 'Yes', no: 'No', unknown: 'I don’t know' };
      const names = ['Incident', 'Claim details', 'Documents', 'Review'];
      const docsStep = fields.length;
      const reviewStep = docsStep + 1;
      const welcomeStep = -1;
      const importStep = -2;
      const receiptStep = -3;
      const requiredKinds = ['incident_report', 'itemized_quote'];
      const maxFiles = 3;
      const maxBytes = 2 * 1024 * 1024;
      const historyEl = document.querySelector('#history');
      const current = document.querySelector('#current');
      const stages = document.querySelector('#stages');
      let step = welcomeStep;
      let editing = false;
      let values = {};
      let sources = {};
      let partialAnswer = '';
      let files = [];
      let importResult = null;
      let importFile = null;
      let revision = 0;
      let token = '';
      let requestId = '';
      let receipt = null;
      let pending = null;
      let busy = false;
      let saveNotice = false;
      let conflict = false;

      function el(tag, cls, text) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function button(text, cls, action) {
        const node = el('button', 'btn ' + cls, text);
        node.type = 'button';
        node.addEventListener('click', () => {
          if (!busy) action();
        });
        return node;
      }

      function today() {
        const parts = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Europe/Berlin',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).formatToParts(new Date());
        const part = (key) => parts.find((p) => p.type === key).value;
        return [part('year'), part('month'), part('day')].join('-');
      }

      function uid() {
        if (crypto.randomUUID) return crypto.randomUUID();
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        bytes[6] = (bytes[6] & 15) | 64;
        bytes[8] = (bytes[8] & 63) | 128;
        const hex = hexString(bytes);
        return [
          hex.slice(0, 8),
          hex.slice(8, 12),
          hex.slice(12, 16),
          hex.slice(16, 20),
          hex.slice(20)
        ].join('-');
      }

      function hexString(bytes) {
        return Array.from(bytes, (byte) =>
          byte.toString(16).padStart(2, '0')
        ).join('');
      }

      function privateToken() {
        if (!token)
          token = hexString(crypto.getRandomValues(new Uint8Array(32)));
        return token;
      }

      function privateURL() {
        const url = new URL('/chat', location.origin);
        url.hash = 'claim=' + token;
        return url.href;
      }

      function status(text) {
        document.getElementById('announce').textContent = text;
      }

      function heading(card, title, help) {
        const titleEl = el('h2', '', title);
        titleEl.id = 'question-title';
        titleEl.tabIndex = -1;
        card.append(titleEl);
        if (help) card.append(el('p', 'help', help));
      }

      function showError(text) {
        const err = current.querySelector('[role=alert]');
        if (!err) return;
        err.textContent = text;
        err.hidden = !text;
      }

      function row(label, value, action) {
        const item = el('div', 'field');
        const details = el('div');
        details.append(el('dt', '', label), el('dd', '', value));
        item.append(details);
        if (action) {
          const edit = button('Edit', 'quiet', action);
          edit.setAttribute('aria-label', 'Edit ' + label);
          item.append(edit);
        }
        return item;
      }

      function setStep(next, isEdit = false) {
        step = next;
        editing = isEdit;
        partialAnswer = '';
        saveNotice = false;
        render(true);
      }

      function nextUnanswered() {
        const index = fields.findIndex((field) => !values[field.key]);
        return index === -1 ? docsStep : index;
      }

      function setBusy(value) {
        busy = value;
        current.setAttribute('aria-busy', String(value));
        current.inert = value;
      }

      async function api(path, body) {
        const resp = await fetch('/api/intakes/' + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          cache: 'no-store',
          referrerPolicy: 'no-referrer'
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) {
          const error = new Error(
            typeof data?.error === 'string'
              ? data.error
              : 'Could not complete this request.'
          );
          error.status = resp.status;
          throw error;
        }
        if (!data || typeof data !== 'object')
          throw new Error('Could not read the response.');
        return data;
      }

      function fieldInput(field, id) {
        const node = el(field.type === 'textarea' ? 'textarea' : 'input');
        node.id = id;
        node.name = field.key;
        if (field.type !== 'textarea') node.type = field.type;
        if (field.type === 'email')
          node.pattern = '[^\\s@]+@[^\\s@.]+([.][^\\s@.]+)+';
        if (field.type === 'date') node.max = today();
        if (field.min) node.minLength = field.min;
        if (field.max) node.maxLength = field.max;
        node.autocomplete = field.type === 'email' ? 'email' : 'off';
        node.addEventListener('input', () => node.setCustomValidity(''));
        return node;
      }

      function validField(field, node) {
        const value = node.value.trim();
        if (!value || (field.min && value.length < field.min)) {
          node.setCustomValidity(
            field.min
              ? 'Enter at least ' + field.min + ' characters.'
              : 'Enter an answer.'
          );
        }
        return node.reportValidity();
      }

      function sourceLabel(source) {
        return source.name + ' · page ' + source.page;
      }

      function drawProgress() {
        const stage = receipt
          ? 4
          : step < 3
            ? 0
            : step < docsStep
              ? 1
              : step === docsStep
                ? 2
                : 3;
        stages.replaceChildren(
          ...names.map((name, index) => {
            const item = el(
              'li',
              'stage ' +
                (index < stage ? 'done' : index === stage ? 'active' : '')
            );
            if (index === stage) item.setAttribute('aria-current', 'step');
            item.append(el('span', 'dot'), document.createTextNode(name));
            return item;
          })
        );
      }

      function drawHistory() {
        historyEl.replaceChildren();
        if (step < 0 || step >= reviewStep || editing) return;
        const completed = fields.filter(
          (field) => values[field.key] && field !== fields[step]
        );
        if (!completed.length) return;
        const details = el('details', 'previous');
        details.append(
          el('summary', '', 'Your answers (' + completed.length + ')')
        );
        const list = el('dl', 'review');
        completed.forEach((field) =>
          list.append(row(field.label, labelValue(field)))
        );
        details.append(list);
        historyEl.append(details);
      }

      function labelValue(field) {
        return field.type === 'choice'
          ? injuries[values[field.key]]
          : values[field.key];
      }

      function validateFile(file, onlyPDF = false) {
        if (!file || !file.size || file.size > maxBytes)
          throw new Error('Choose a non-empty file up to 2 MiB.');
        if (
          !file.name.trim() ||
          file.name !== file.name.trim() ||
          file.name.length > 180 ||
          /[\x00-\x1f\x7f-\x9f/\\]/.test(file.name)
        ) {
          throw new Error(
            'Use a filename up to 180 characters without path separators.'
          );
        }
        const ext = file.name.toLowerCase().split('.').pop();
        if (
          onlyPDF ? ext !== 'pdf' : !['png', 'jpg', 'jpeg', 'pdf'].includes(ext)
        ) {
          throw new Error(
            onlyPDF
              ? 'Choose a PDF report or quote.'
              : 'Choose a PDF, JPEG or PNG file.'
          );
        }
      }

      async function encodeFile(file, kind) {
        const encoded = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(',')[1]);
          reader.onerror = () =>
            reject(
              new Error('The file could not be read. Please choose it again.')
            );
          reader.readAsDataURL(file);
        });
        return { kind, name: file.name, content_base64: encoded };
      }

      function fileButton(container, label, id, accept, onFiles, options = {}) {
        const input = el('input');
        input.type = 'file';
        input.id = id;
        input.hidden = true;
        input.accept = accept;
        input.multiple = Boolean(options.multiple);
        if (options.camera) input.setAttribute('capture', 'environment');
        const choose = button(label, options.style || '', () => input.click());
        input.addEventListener('change', () => {
          const selected = Array.from(input.files);
          input.value = '';
          if (selected.length && !busy) onFiles(selected);
        });
        container.append(input, choose);
        return choose;
      }

      function drawWelcome(card) {
        heading(
          card,
          'How would you like to start?',
          'An accident report can fill in details for you. You’ll check each answer before it is used.'
        );
        const drop = el('div', 'drop-zone');
        const icon = el('span', 'upload-icon', '↑');
        icon.setAttribute('aria-hidden', 'true');
        drop.append(icon);
        fileButton(
          drop,
          'Import a PDF',
          'import-file',
          '.pdf,application/pdf',
          (list) => importPDF(list[0]),
          { style: 'primary' }
        );
        drop.append(
          el('span', 'file-hint', 'Or drop one PDF here · up to 2 MiB')
        );
        drop.addEventListener('dragover', (event) => {
          event.preventDefault();
          drop.classList.add('over');
        });
        drop.addEventListener('dragleave', () => drop.classList.remove('over'));
        drop.addEventListener('drop', (event) => {
          event.preventDefault();
          drop.classList.remove('over');
          if (busy) return;
          if (event.dataTransfer.files.length !== 1)
            return showError('Drop one PDF to start your claim.');
          importPDF(event.dataTransfer.files[0]);
        });
        const actions = el('div', 'actions');
        actions.append(button('Tell me what happened', '', () => setStep(0)));
        const sample = el('a', 'sample', 'Download sample accident report');
        sample.href = '/sample-accident-report.pdf';
        sample.download = 'sample-accident-report.pdf';
        card.append(drop, actions, sample);
      }

      async function importPDF(file) {
        try {
          validateFile(file, true);
          setBusy(true);
          status('Reading your PDF.');
          const help = current.querySelector('.file-hint');
          if (help) help.textContent = 'Reading ' + file.name + '…';
          importFile = await encodeFile(file, '');
          try {
            importResult = await api('import-pdf', {
              name: importFile.name,
              content_base64: importFile.content_base64
            });
            if (!Array.isArray(importResult.suggestions))
              throw new Error('Unexpected import response.');
          } catch {
            importResult = {
              suggestions: [],
              document_kind: null,
              notice:
                'We couldn’t read the PDF. You can attach it and enter the answers yourself.'
            };
          }
          setStep(importStep);
        } catch (error) {
          showError(error.message);
        } finally {
          setBusy(false);
          status('');
        }
      }

      function kindSelect(includeBlank) {
        const select = el('select');
        if (includeBlank) select.add(new Option('Choose document type', ''));
        Object.entries(kinds).forEach(([key, name]) =>
          select.add(new Option(name, key))
        );
        return select;
      }

      function drawImport(card) {
        heading(card, 'Check your PDF details', importFile.name);
        if (importResult.notice)
          card.append(el('p', 'help', importResult.notice));
        const form = el('form');
        const typeLabel = el('label', 'label', 'Document type');
        typeLabel.htmlFor = 'import-kind';
        const select = kindSelect(true);
        select.id = 'import-kind';
        select.required = true;
        select.value =
          importResult.document_kind in kinds ? importResult.document_kind : '';
        form.append(typeLabel, select);
        const extracted = [];
        for (const field of fields.filter((f) => f.type !== 'choice')) {
          const options = importResult.suggestions.filter(
            (s) =>
              s.field === field.key &&
              typeof s.value === 'string' &&
              Number.isInteger(s.page)
          );
          if (!options.length) continue;
          const wrap = el('div', 'suggestion');
          const label = el('label', 'label', field.label);
          const input = fieldInput(field, 'import-' + field.key);
          label.htmlFor = input.id;
          const conflict = new Set(options.map((s) => s.value)).size > 1;
          let source = conflict
            ? null
            : { name: importFile.name, page: options[0].page };
          const cite = el(
            'small',
            'citation',
            source
              ? sourceLabel(source)
              : 'Several values found. Choose one or enter your own.'
          );
          input.value = conflict ? '' : options[0].value;
          const matchingSource = () => {
            const match =
              options.find(
                (option) =>
                  option.value === input.value.trim() &&
                  (!source || option.page === source.page)
              ) ||
              options.find((option) => option.value === input.value.trim());
            return match ? { name: importFile.name, page: match.page } : null;
          };
          input.addEventListener('input', () => {
            const matched = matchingSource();
            cite.textContent = matched
              ? sourceLabel(matched)
              : input.value.trim()
                ? 'Your correction · originally suggested from ' +
                  importFile.name
                : 'You can answer this question later.';
          });
          wrap.append(label, cite, input);
          if (conflict) {
            const choices = el('div', 'choices');
            for (const option of options) {
              choices.append(
                button(option.value + ' · page ' + option.page, '', () => {
                  input.value = option.value;
                  input.setCustomValidity('');
                  source = { name: importFile.name, page: option.page };
                  cite.textContent = sourceLabel(source);
                })
              );
            }
            wrap.append(choices);
          }
          extracted.push({ field, input, source: matchingSource });
          form.append(wrap);
        }
        const actions = el('div', 'actions');
        const use = el(
          'button',
          'btn primary',
          extracted.length
            ? 'Confirm details and continue'
            : 'Attach PDF and continue'
        );
        use.type = 'submit';
        actions.append(
          use,
          button('Choose another start', 'quiet', () => {
            importResult = importFile = null;
            setStep(welcomeStep);
          })
        );
        form.append(actions);
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const chosen = extracted.filter((item) => item.input.value.trim());
          if (!chosen.every((item) => validField(item.field, item.input)))
            return;
          for (const item of chosen) {
            values[item.field.key] = item.input.value.trim();
            if (item.source()) sources[item.field.key] = item.source();
          }
          files.push({ ...importFile, kind: select.value });
          importResult = importFile = null;
          setStep(nextUnanswered());
        });
        card.append(form);
      }

      function drawQuestion(card) {
        const field = fields[step];
        heading(card, field.prompt, field.hint);
        if (sources[field.key])
          card.append(
            el(
              'p',
              'citation',
              'Imported from ' + sourceLabel(sources[field.key])
            )
          );
        function finish(value) {
          if (value !== (values[field.key] || partialAnswer))
            delete sources[field.key];
          values[field.key] = value;
          setStep(editing ? reviewStep : nextUnanswered());
        }
        if (field.type === 'choice') {
          const choices = el('div', 'choices');
          Object.entries(injuries).forEach(([key, name]) =>
            choices.append(
              button(name, values[field.key] === key ? 'primary' : '', () =>
                finish(key)
              )
            )
          );
          card.append(choices);
        } else {
          const form = el('form');
          const input = fieldInput(field, 'answer');
          input.value = partialAnswer || values[field.key] || '';
          input.required = true;
          input.setAttribute('aria-labelledby', 'question-title');
          const actions = el('div', 'actions');
          const proceed = el(
            'button',
            'btn primary',
            editing ? 'Save answer' : 'Continue'
          );
          proceed.type = 'submit';
          actions.append(proceed);
          form.append(input, actions);
          form.addEventListener('submit', (event) => {
            event.preventDefault();
            if (validField(field, input)) finish(input.value.trim());
          });
          card.append(form);
        }
        if (editing)
          card.append(
            button('Cancel edit', 'quiet', () => setStep(reviewStep))
          );
        else if (step > 0) {
          card.append(button('Back', 'quiet', () => setStep(step - 1)));
        }
      }

      function checklist(card, docs) {
        const group = el('ul', 'checklist');
        group.setAttribute('aria-label', 'Document checklist');
        for (const kind of requiredKinds) {
          const received = docs.some((doc) => doc.kind === kind);
          const line = el('li', received ? 'present' : 'missing');
          line.append(
            el('strong', '', kinds[kind]),
            el('span', '', received ? 'Included' : 'Still needed')
          );
          group.append(line);
        }
        card.append(group);
      }

      function fileList(card, docs, allowChanges) {
        if (!docs.length) return;
        const list = el('ul', 'files');
        list.setAttribute(
          'aria-label',
          allowChanges ? 'Attachments to send' : 'Received attachments'
        );
        docs.forEach((doc, index) => {
          const li = el('li', 'file');
          if (doc.content_base64 && /\.(png|jpe?g)$/i.test(doc.name)) {
            const image = el('img', 'thumb');
            image.alt = 'Preview of ' + doc.name;
            image.src =
              'data:image/' +
              (/\.png$/i.test(doc.name) ? 'png' : 'jpeg') +
              ';base64,' +
              doc.content_base64;
            li.append(image);
          }
          const info = el('div', 'file-info');
          info.append(
            el('small', '', kinds[doc.kind]),
            el('span', '', doc.name)
          );
          li.append(info);
          if (allowChanges) {
            const actions = el('div', 'file-buttons');
            if (doc.kind === 'damage_photo') {
              fileButton(
                actions,
                'Retake',
                'retake-' + index,
                'image/*',
                (add) => addFiles(add, 'damage_photo', index),
                { camera: true, style: 'quiet' }
              );
            }
            const remove = button('Remove', 'quiet', () => {
              files.splice(index, 1);
              render(false);
            });
            remove.setAttribute('aria-label', 'Remove ' + doc.name);
            actions.append(remove);
            li.append(actions);
          }
          list.append(li);
        });
        card.append(list);
      }

      async function addFiles(list, kind, replaceIndex) {
        try {
          if (receipt) {
            if (
              !receipt.missing_documents.includes(kind) ||
              files.some((doc) => doc.kind === kind) ||
              list.length !== 1
            ) {
              throw new Error('Choose one file for each outstanding document.');
            }
          } else if (
            files.length + list.length - (replaceIndex === undefined ? 0 : 1) >
            maxFiles
          ) {
            throw new Error(
              'Choose up to 3 files for the initial claim. Remove a file before choosing another.'
            );
          }
          list.forEach((file) => validateFile(file));
          setBusy(true);
          const docs = await Promise.all(
            list.map((file) => encodeFile(file, kind))
          );
          if (replaceIndex === undefined) files.push(...docs);
          else files.splice(replaceIndex, 1, ...docs);
          render(false);
          status('Attachment added.');
        } catch (err) {
          showError(err.message);
        } finally {
          setBusy(false);
        }
      }

      function uploadControls(card, allDocs) {
        if (!receipt && allDocs.length >= maxFiles) {
          card.append(
            el('p', 'file-hint', 'All 3 initial attachment slots are used.')
          );
          return;
        }
        const outstanding = receipt
          ? receipt.missing_documents.filter(
              (kind) => !files.some((doc) => doc.kind === kind)
            )
          : [];
        if (receipt && !outstanding.length) return;
        const group = el('div', 'upload-controls');
        const label = el('label', 'label', 'Paperwork type');
        label.htmlFor = 'document-kind';
        const kind = receipt ? el('select') : kindSelect(false);
        if (receipt)
          outstanding.forEach((key) => kind.add(new Option(kinds[key], key)));
        kind.id = 'document-kind';
        kind.value = receipt
          ? outstanding[0]
          : requiredKinds.find((k) => !allDocs.some((doc) => doc.kind === k)) ||
            requiredKinds[0];
        group.append(label, kind);
        const buttons = el('div', 'actions');
        fileButton(
          buttons,
          'Attach paperwork',
          'doc-files',
          '.pdf,.jpg,.jpeg,.png',
          (list) => addFiles(list, kind.value),
          { multiple: !receipt }
        );
        group.append(buttons);
        if (receipt) {
          group.append(
            el('p', 'file-hint', 'PDF, JPEG or PNG · up to 2 MiB per file')
          );
          card.append(group);
          return;
        }
        const photoLabel = el('p', 'label', 'Damage photos');
        const photos = el('div', 'choices photo-actions');
        fileButton(
          photos,
          'Take a photo',
          'camera-file',
          'image/*',
          (list) => addFiles(list, 'damage_photo'),
          { camera: true }
        );
        fileButton(
          photos,
          'Choose from gallery',
          'gallery-files',
          'image/jpeg,image/png',
          (list) => addFiles(list, 'damage_photo'),
          { multiple: true }
        );
        group.append(
          photoLabel,
          photos,
          el('p', 'file-hint', 'PDF, JPEG or PNG · up to 2 MiB per file')
        );
        card.append(group);
      }

      function drawDocuments(card) {
        heading(
          card,
          'Which documents can you attach?',
          'You can submit now and use your private link to add missing paperwork later.'
        );
        checklist(card, files);
        fileList(card, files, true);
        uploadControls(card, files);
        const actions = el('div', 'actions');
        actions.append(
          button('Review claim', 'primary', () => setStep(reviewStep)),
          button('Back', 'quiet', () =>
            setStep(editing ? reviewStep : fields.length - 1)
          )
        );
        card.append(actions);
      }

      function drawReview(card) {
        heading(
          card,
          'Ready to submit your claim?',
          'Check your answers and attachments. Submitting sends them to the claims team.'
        );
        const list = el('dl', 'review');
        fields.forEach((field, i) => {
          const item = row(field.label, labelValue(field), () =>
            setStep(i, true)
          );
          item
            .querySelector('div')
            .append(
              el(
                'small',
                'citation',
                sources[field.key]
                  ? 'Imported from ' + sourceLabel(sources[field.key])
                  : 'Provided by you'
              )
            );
          list.append(item);
        });
        list.append(
          row(
            'Documents',
            files.map((doc) => doc.name).join('\n') || 'No documents attached',
            () => setStep(docsStep, true)
          )
        );
        card.append(list);
        checklist(card, files);
        const actions = el('div', 'actions');
        actions.append(button('Submit claim', 'primary', submitClaim));
        card.append(actions);
      }

      function captureInput() {
        const input = current.querySelector('#answer');
        if (input) partialAnswer = input.value;
      }

      function saveDraft() {
        const previousAnswer = fields[step]
          ? values[fields[step].key] || partialAnswer
          : '';
        captureInput();
        const draftValues = { ...values };
        const draftSources = { ...sources };
        if (step >= 0 && step < docsStep && fields[step].type !== 'choice') {
          draftValues[fields[step].key] = partialAnswer;
          if (partialAnswer !== previousAnswer)
            delete draftSources[fields[step].key];
        }
        sendOperation('save-draft', {
          token: privateToken(),
          expected_revision: revision,
          draft: {
            values: draftValues,
            documents: files,
            sources: draftSources,
            step
          }
        });
      }

      function submitClaim() {
        if (!requestId) requestId = uid();
        sendOperation('submit', {
          token: privateToken(),
          expected_revision: revision,
          payload: { ...values, request_id: requestId, documents: files }
        });
      }

      async function sendOperation(path, body) {
        if (busy) return;
        pending = { path, body };
        setBusy(true);
        status('Sending…');
        try {
          const data = await api(path, body);
          if (path === 'save-draft') {
            if (data.status !== 'draft' || !Number.isInteger(data.revision))
              throw new Error('Incomplete draft receipt.');
            revision = data.revision;
            saveNotice = true;
            history.replaceState(null, '', privateURL());
          } else {
            acceptReceipt(data);
            history.replaceState(null, '', privateURL());
          }
          pending = null;
          conflict = false;
          render(path !== 'save-draft');
          status(path === 'save-draft' ? 'Draft saved.' : 'Receipt updated.');
        } catch (err) {
          if ([400, 404, 409, 413, 415, 422].includes(err.status)) {
            pending = null;
            conflict = err.status === 409;
          }
          render(false);
          showError(
            pending
              ? 'Your connection was interrupted. Retry to confirm what was saved.'
              : err.message
          );
        } finally {
          setBusy(false);
        }
      }

      function acceptReceipt(data) {
        if (
          data.status !== 'submitted' ||
          typeof data.reference !== 'string' ||
          !Array.isArray(data.documents) ||
          !Array.isArray(data.missing_documents) ||
          data.documents.length !== data.document_count
        )
          throw new Error('Could not confirm the receipt.');
        values = {};
        files = [];
        sources = {};
        importResult = importFile = null;
        partialAnswer = '';
        receipt = data;
        step = receiptStep;
        saveNotice = false;
        editing = false;
      }

      function drawReceipt(card) {
        heading(
          card,
          'Claim received',
          'Keep your reference and private follow-up link.'
        );
        card.append(el('p', 'reference', receipt.reference));
        const copy = button('Copy reference', 'quiet', () =>
          copyText(receipt.reference, copy)
        );
        card.append(copy);
        card.append(
          el('h3', '', 'Files received (' + receipt.document_count + ')')
        );
        fileList(card, receipt.documents, false);
        const missing = receipt.missing_documents.map((k) => kinds[k] || k);
        card.append(
          el(
            'p',
            'file-hint',
            missing.length
              ? 'Still needed: ' + missing.join(', ') + '.'
              : 'All requested paperwork has been received.'
          )
        );
        linkPanel(card, 'Private follow-up link');
        if (receipt.missing_documents.length) {
          const details = el('details', 'follow-up');
          details.open = files.length > 0;
          details.append(el('summary', '', 'Add documents to this claim'));
          fileList(details, files, true);
          uploadControls(details, [...receipt.documents, ...files]);
          if (files.length) {
            const send = button('Send additional documents', 'primary', () =>
              sendOperation('add-documents', {
                token,
                request_id: uid(),
                documents: files
              })
            );
            details.append(send);
          }
          card.append(details);
        }
        card.append(button('Report another claim', 'quiet', fresh));
      }

      async function copyText(text, action) {
        try {
          await navigator.clipboard.writeText(text);
          status('Copied.');
          action.textContent = 'Copied';
        } catch {
          const copyBox = el('input');
          copyBox.readOnly = true;
          copyBox.value = text;
          copyBox.setAttribute('aria-label', 'Select and copy');
          action.after(copyBox);
          copyBox.select();
          status('Select and copy the text.');
        }
      }

      function linkPanel(card, title) {
        const panel = el('div', 'link-panel');
        panel.append(
          el('strong', '', title),
          el(
            'p',
            'file-hint',
            'Anyone with this link can open it. Keep it private.'
          )
        );
        const input = el('input');
        input.type = 'text';
        input.readOnly = true;
        input.value = privateURL();
        input.setAttribute('aria-label', title);
        input.addEventListener('focus', () => input.select());
        const copy = button('Copy private link', 'quiet', () =>
          copyText(privateURL(), copy)
        );
        panel.append(input, copy);
        card.append(panel);
      }

      function fresh() {
        history.replaceState(null, '', location.pathname);
        token = '';
        requestId = '';
        revision = 0;
        values = {};
        sources = {};
        files = [];
        receipt = pending = importFile = importResult = null;
        conflict = false;
        setStep(welcomeStep);
      }

      async function resume() {
        setBusy(true);
        status('Opening private link…');
        try {
          const data = await api('resume', { token });
          if (data.status === 'submitted') acceptReceipt(data);
          else if (
            data.status === 'draft' &&
            data.draft &&
            Number.isInteger(data.revision)
          ) {
            revision = data.revision;
            const draft = data.draft;
            values = { ...draft.values };
            sources = { ...draft.sources };
            files = draft.documents;
            step = draft.step;
            partialAnswer = '';
            if (
              step >= 0 &&
              step < docsStep &&
              fields[step].type !== 'choice'
            ) {
              partialAnswer = values[fields[step].key] || '';
              delete values[fields[step].key];
            }
            if (
              step < 0 ||
              step > reviewStep ||
              (step >= docsStep && nextUnanswered() < docsStep)
            )
              step = nextUnanswered();
            receipt = null;
          } else throw new Error('Invalid draft receipt.');
          conflict = false;
          pending = null;
          editing = saveNotice = false;
          render(true);
          status(
            data.status === 'submitted'
              ? 'Claim receipt opened.'
              : 'Draft opened.'
          );
        } catch (error) {
          current.replaceChildren();
          const card = el('div', 'card');
          heading(
            card,
            'Couldn’t open this private link',
            error.status === 404
              ? 'Check that you copied the complete link.'
              : 'Check your connection and try again.'
          );
          card.append(
            button('Try again', 'primary', resume),
            button('Start a new claim', 'quiet', fresh)
          );
          current.append(card);
        } finally {
          setBusy(false);
        }
      }

      function render(focus) {
        drawProgress();
        drawHistory();
        current.replaceChildren();
        const card = el('div', 'card');
        current.append(card);
        if (pending || conflict) {
          heading(
            card,
            pending
              ? 'Confirm your last request'
              : 'Your saved claim has changed',
            pending
              ? 'Retry the same request to check whether it reached the claims team.'
              : 'Open the latest saved version before continuing.'
          );
          if (pending)
            card.append(
              button('Retry request', 'primary', () =>
                sendOperation(pending.path, pending.body)
              )
            );
          if (conflict)
            card.append(button('Open latest saved version', 'primary', resume));
        } else if (receipt) drawReceipt(card);
        else if (step === welcomeStep) drawWelcome(card);
        else if (step === importStep) drawImport(card);
        else if (step === docsStep) drawDocuments(card);
        else if (step === reviewStep) drawReview(card);
        else drawQuestion(card);
        const error = el('p', 'error');
        error.setAttribute('role', 'alert');
        error.hidden = true;
        card.append(error);
        if (!pending && !conflict && step >= 0 && !receipt) {
          const save = el('div', 'save-bar');
          save.append(button('Save and continue later', 'quiet', saveDraft));
          if (saveNotice) linkPanel(save, 'Draft saved · private resume link');
          card.append(save);
        }
        if (focus) {
          card.querySelector('h2')?.focus({ preventScroll: true });
          card.scrollIntoView({ block: 'nearest' });
        }
      }

      window.addEventListener('hashchange', () => location.reload());
      render(false);
      if (location.hash) {
        const match = /^#claim=([0-9a-f]{64})$/.exec(location.hash);
        if (match) {
          token = match[1];
          resume();
        } else
          showError(
            'This link is incomplete. Open the full private link or start a new claim.'
          );
      }
    </script>
  </body>
</html>
