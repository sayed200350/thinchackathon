<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claims queue · Policy Twin</title>
  <script defer src="/incoming.js"></script>
  <style>
    :root { color-scheme: light; --ink:#222321; --paper:#fcfcfa; --line:#d9dad5; --soft:#f3f3ef; --muted:#5b5e57; --accent:#c34815; --mono:"JetBrains Mono",ui-monospace,monospace; }
    * { box-sizing:border-box }
    [hidden] { display:none!important }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 "Inter Tight",system-ui,sans-serif }
    .bar, main { max-width:1200px; margin:auto; padding:0 clamp(16px,4vw,54px) }
    header { border-bottom:1px solid var(--line) }
    .bar,.actions,.section-head,.meta { display:flex; align-items:center; gap:12px; flex-wrap:wrap }
    .bar { min-height:60px; justify-content:space-between }
    .brand { font-weight:500; letter-spacing:-.03em }
    a,button.link { color:var(--ink); text-underline-offset:3px }
    main { padding-top:32px; padding-bottom:64px }
    .eyebrow,th { text-transform:uppercase; letter-spacing:.09em; font:500 11px/1.6 var(--mono); color:var(--muted) }
    h1,h2,h3,strong { font-weight:500 }
    h1 { font-size:clamp(32px,5vw,50px); line-height:1.12; letter-spacing:-.05em; margin:6px 0 22px }
    h2 { margin:0 0 12px; font-size:21px; letter-spacing:-.03em }
    h3 { font-size:15px; margin:16px 0 4px }
    button,input { font:inherit; border:1px solid #babdb5; border-radius:4px; background:white; padding:8px 12px; color:inherit }
    button { cursor:pointer }
    button:hover { background:var(--soft) }
    button:disabled { cursor:wait; opacity:.6 }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px }
    button.primary { background:var(--ink); color:white; border-color:var(--ink) }
    button.link { padding:0; border:0; background:none; text-align:left; text-decoration:underline }
    input { min-width:0; width:min(43ch,100%); font:14px var(--mono) }
    .section-head { justify-content:space-between; gap:16px; align-items:end; margin:12px 0 }
    label { display:block; margin-bottom:4px }
    .frame,article { border:1px solid var(--line); border-radius:8px; background:white }
    .frame { overflow:hidden }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:14px }
    th { background:var(--soft); font-weight:500 }
    td,th { padding:12px 15px; border-bottom:1px solid var(--line) }
    tbody tr:last-child td { border-bottom:0 }
    tbody tr:hover { background:var(--soft) }
    td small { display:block; margin-top:3px }
    code,.ref,.date,dd { font:13px/1.5 var(--mono); overflow-wrap:anywhere }
    .chip { display:inline-flex; gap:6px; align-items:center; border:1px solid var(--line); border-radius:4px; padding:3px 8px; font-size:13px; background:var(--soft) }
    .chip::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none }
    .human_review { color:#774604; background:#fff3d8; border-color:#e7c988 }
    .request_information { color:#275575; background:#eaf3fa; border-color:#b3cede }
    .routine_processing { color:#1e6546; background:#e9f6ed; border-color:#abd4b5 }
    #notice { color:var(--muted); margin:12px 0 }
    #notice:empty { margin:0 }
    #more { margin-top:12px }
    #heading { font:500 clamp(20px,3vw,32px)/1.3 var(--mono); overflow-wrap:anywhere; margin:6px 0 20px }
    .case-grid { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr); gap:16px; align-items:start }
    article,.proposal { padding:clamp(16px,2.5vw,28px); margin-bottom:14px }
    article p { margin:9px 0; overflow-wrap:anywhere }
    .meta { gap:12px 24px }
    dl { margin:12px 0 0 }
    dt,small { color:var(--muted); font-size:12px }
    dd { margin:1px 0 10px }
    ul { padding-left:20px }
    .files { list-style:none; padding:0; margin:0 }
    .files li { border-top:1px solid var(--line); padding:9px 0; overflow-wrap:anywhere }
    .files small { display:block }
    .proposal { border:1px solid var(--line); border-radius:8px }
    summary { cursor:pointer; font-weight:500 }
    #simulate { margin-top:12px }
    #limit { width:10ch }
    #comparison { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px }
    #comparison:empty { display:none }
    @media(max-width:740px) {
      .case-grid,#comparison { grid-template-columns:1fr }
      th.optional,td.optional { display:none }
      td,th { padding:10px }
      .ref { font-size:12px }
      .actions input { flex:1 }
      #lookup { width:100% }
      main { padding-top:20px }
    }
  </style>
</head>
<body>
<header><nav class="bar" aria-label="Insurer navigation"><span class="brand">Policy Twin / Insurer</span><a href="/">Policy workbench</a></nav></header>
<main>
  <p id="notice" role="status" aria-live="polite"></p>
  <section id="queue" aria-labelledby="queue-title">
    <h1 id="queue-title" tabindex="-1">Claims queue</h1>
    <div class="section-head">
      <form id="lookup"><label for="reference">Open by claim reference</label>
        <div class="actions"><input id="reference" type="text" placeholder="CLM-…" autocomplete="off" spellcheck="false" required><button class="primary">Open claim</button></div>
      </form>
      <button id="refresh">Refresh inbox</button>
    </div>
    <div id="workspace" hidden>
      <div class="frame"><table aria-label="Submitted claims"><thead><tr><th>Claim reference</th><th>Handling step</th><th class="optional">Engine rule</th><th class="optional">Files</th><th class="optional">Submitted</th></tr></thead><tbody id="rows"></tbody></table></div>
      <button id="more" hidden>Load more claims</button>
    </div>
  </section>
  <section id="case" hidden aria-labelledby="heading">
    <button id="back" class="link">← Back to claims queue</button>
    <p class="eyebrow">Submitted claim</p><h1 id="heading" tabindex="-1">Claim detail</h1>
    <div id="detail" class="case-grid"></div>
    <article id="version-panel" hidden><h2>Policy replay</h2>
      <button type="button" id="versions">Compare recorded V1 with V2</button>
      <div id="versions-result" aria-live="polite"></div>
    </article>
    <details id="proposal" class="proposal" hidden><summary>Simulate a different quote limit</summary>
      <form id="simulate"><label for="limit">Human review for quotes above (€)</label>
        <div class="actions"><input type="number" id="limit" min="1" max="1000000" step="1" value="2000" required><button class="primary">Replay this claim</button></div></form>
      <div id="comparison" aria-live="polite"></div>
    </details>
  </section>
</main></body></html>
