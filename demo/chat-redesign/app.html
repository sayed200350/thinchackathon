<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retakt</title>
<link rel="stylesheet" href="/retakt.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .view { flex: 1; min-height: 0; display: none; }
  .view.on { display: block; }
  /* New claim: title on top, conversation in the middle, input pinned at the bottom centre. */
  #new.on { display: flex; flex-direction: column; }
  .report-head { text-align: center; padding: 18px 18px 8px; }
  .report-head h1 { margin: 6px 0 0; }
  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .hint { margin: auto 0; text-align: center; color: var(--muted-foreground); font-size: 14px; line-height: 1.5; padding: 0 12px; }
  .bubble { max-width: 82%; padding: 10px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; }
  .bubble.ai { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .bubble.me { align-self: flex-end; background: var(--primary); color: var(--primary-foreground); border-bottom-right-radius: 6px; }
  .bubble.wait { color: var(--muted-foreground); }
  .composer { display: flex; justify-content: center; padding: 10px 14px max(14px, env(safe-area-inset-bottom)); }
  .composer form { display: flex; align-items: center; gap: 6px; width: 100%; max-width: 420px; padding: 5px 5px 5px 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); }
  .composer form:focus-within { border-color: var(--ring); }
  .composer input { all: unset; flex: 1; min-width: 0; font-size: 15px; color: var(--foreground); padding: 8px 0; }
  .composer input::placeholder { color: var(--muted-foreground); }
  .send { all: unset; box-sizing: border-box; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); cursor: pointer; font-size: 17px; }
  .send:disabled { opacity: .35; cursor: default; }
  .send:focus-visible, .composer input:focus-visible { outline: none; }
  /* Documents + submit card, shown once the assistant has all six facts. */
  .docs { align-self: stretch; display: grid; gap: 10px; padding: 14px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); }
  .docs h2 { margin: 0; font-size: 15px; font-weight: 500; }
  .docs p { margin: 0; color: var(--muted-foreground); font-size: 13px; line-height: 1.4; }
  .doc { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 12px; cursor: pointer; font-size: 13.5px; }
  .doc.ok { border-style: solid; border-color: var(--decision-fast-line); }
  .doc .name { color: var(--muted-foreground); font: 500 11px var(--font-mono); max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  .doc.ok .name { color: var(--decision-fast); }
  .doc input { display: none; }
  .submit { all: unset; box-sizing: border-box; text-align: center; padding: 11px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); font: 500 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .submit:disabled { opacity: .35; cursor: default; }
  .err { color: var(--destructive, #e5484d); font-size: 13px; }
  .receipt .ref { font: 500 12px var(--font-mono); color: var(--foreground); word-break: break-all; }
  #claims { overflow-y: auto; padding: 22px 18px 18px; }
  .eyebrow { font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
  h1 { font-size: 30px; font-weight: 500; letter-spacing: -.02em; margin: 6px 0 18px; }
  .list { display: grid; gap: 10px; }
  .item { all: unset; box-sizing: border-box; display: grid; gap: 6px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); cursor: pointer; }
  .item:focus-visible, .tab:focus-visible, .back:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .id { font: 500 13px var(--font-mono); }
  .sub { color: var(--muted-foreground); font-size: 14px; line-height: 1.4; }
  .badge { font: 500 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--decision-standard-line); background: var(--decision-standard-soft); white-space: nowrap; }
  .badge.fast { color: var(--decision-fast); border-color: var(--decision-fast-line); background: var(--decision-fast-soft); }
  .badge.reject { color: var(--decision-reject); border-color: var(--decision-reject-line); background: var(--decision-reject-soft); }
  .back { all: unset; cursor: pointer; font: 500 12px var(--font-mono); color: var(--muted-foreground); margin-bottom: 14px; display: inline-block; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 16px 0 0; font-size: 14px; }
  dt { color: var(--muted-foreground); } dd { margin: 0; text-align: right; }
  .note, .empty { color: var(--muted-foreground); font-size: 14px; padding: 18px 0; }
  /* Small segmented switch, centred at the top. */
  .tabs-wrap { display: flex; justify-content: center; padding: max(12px, env(safe-area-inset-top)) 14px 0; }
  .tabs { display: inline-flex; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); }
  .tab { all: unset; box-sizing: border-box; text-align: center; padding: 6px 14px; border-radius: 999px; font: 500 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
</style>
</head>
<body>
<div class="tabs-wrap">
  <nav class="tabs" role="tablist" aria-label="Retakt">
    <button class="tab" role="tab" id="tab-new" aria-selected="true" type="button">New claim</button>
    <button class="tab" role="tab" id="tab-claims" aria-selected="false" type="button">My claims</button>
  </nav>
</div>
<section class="view on" id="new" aria-label="New claim">
  <header class="report-head"><span class="eyebrow">Retakt</span><h1>Report a claim</h1></header>
  <div class="thread" id="thread" aria-live="polite">
    <p class="hint" id="hint">Tell us what happened to your vehicle.<br>We take care of the rest.</p>
  </div>
  <div class="composer">
    <form id="ask" autocomplete="off">
      <input id="say" maxlength="2000" placeholder="What happened?" aria-label="Describe what happened">
      <button class="send" id="send" type="submit" aria-label="Send" disabled>↑</button>
    </form>
  </div>
</section>
<section class="view" id="claims" aria-label="My claims"></section>
<script>
'use strict';
const API = new URLSearchParams(location.search).get('api') || '';
const $ = (id) => document.getElementById(id);
const status = {
  routine_processing: ['Being processed', 'fast'],
  request_information: ['More information needed', ''],
  human_review: ['Under review by a person', 'reject']
};
function node(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function badge(route) { const [label, cls] = status[route] || [route, '']; return node('span', 'badge ' + cls, label); }
async function get(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error('Could not load your claims. Please try again.');
  return r.json();
}
function select(name) {
  for (const t of ['new', 'claims']) {
    $('tab-' + t).setAttribute('aria-selected', String(t === name));
    $(t).classList.toggle('on', t === name);
  }
  if (name === 'claims') showList();
}
async function showList() {
  const box = $('claims');
  box.replaceChildren(node('span', 'eyebrow', 'Retakt'), node('h1', '', 'My claims'), node('p', 'empty', 'Loading…'));
  try {
    const { claims: all } = await get('/api/claims');
    // A customer has only a few claims: show three, one per status where possible.
    const MAX_CLAIMS = 3, seen = new Set(), claims = [];
    for (const c of all) if (claims.length < MAX_CLAIMS && !seen.has(c.effective_recommendation)) { seen.add(c.effective_recommendation); claims.push(c); }
    for (const c of all) if (claims.length < MAX_CLAIMS && !claims.includes(c)) claims.push(c);
    const list = node('div', 'list');
    for (const c of claims) {
      const b = node('button', 'item'); b.type = 'button';
      const row = node('div', 'row'); row.append(node('span', 'id', c.case_id), badge(c.effective_recommendation));
      b.append(row, node('span', 'sub', c.case_status === 'closed' ? 'Closed' : 'Open'));
      b.addEventListener('click', () => showDetail(c.case_id));
      list.append(b);
    }
    box.replaceChildren(node('span', 'eyebrow', 'Retakt'), node('h1', '', 'My claims'),
      claims.length ? list : node('p', 'empty', 'You have not submitted a claim yet.'));
  } catch (e) { box.replaceChildren(node('span', 'eyebrow', 'Retakt'), node('h1', '', 'My claims'), node('p', 'note', e.message)); }
}
async function showDetail(id) {
  const box = $('claims');
  const back = node('button', 'back', '← All claims'); back.type = 'button'; back.addEventListener('click', showList);
  box.replaceChildren(back, node('p', 'empty', 'Loading…'));
  try {
    const d = await get('/api/claims/' + encodeURIComponent(id));
    const rows = [['Claim', d.claim.case_id], ['Status', d.claim.case_status === 'closed' ? 'Closed' : 'Open'],
      ['Repair quote', '€' + d.claim.quote_eur]];
    const dl = node('dl');
    for (const [k, v] of rows) dl.append(node('dt', '', k), node('dd', '', v));
    const head = node('div', 'row'); head.append(node('h1', '', id), badge(d.effective_recommendation));
    box.replaceChildren(back, head, node('p', 'sub', d.claim.claim_summary || ''),
      node('p', 'sub', d.decision && d.decision.explanation ? d.decision.explanation : ''), dl);
  } catch (e) { box.replaceChildren(back, node('p', 'note', e.message)); }
}
// ---- Report a claim: chat with the claims assistant (/api/intake-chat in the preview proxy).
const chat = { log: [], values: {}, busy: false };
function bubble(role, text, extra) {
  $('hint')?.remove();
  const b = node('div', 'bubble ' + (role === 'user' ? 'me' : 'ai') + (extra ? ' ' + extra : ''), text);
  $('thread').append(b);
  $('thread').scrollTop = $('thread').scrollHeight;
  return b;
}
$('say').addEventListener('input', () => { $('send').disabled = chat.busy || !$('say').value.trim(); });
$('ask').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('say').value.trim();
  if (!text || chat.busy) return;
  $('say').value = ''; $('send').disabled = true; chat.busy = true;
  chat.log.push({ role: 'user', content: text });
  bubble('user', text);
  const wait = bubble('assistant', '…', 'wait');
  try {
    const r = await fetch(API + '/api/intake-chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chat.log, values: chat.values }) });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(out.error || 'Something went wrong. Please try again.');
    chat.values = out.values || chat.values;
    chat.log.push({ role: 'assistant', content: out.reply });
    wait.textContent = out.reply; wait.classList.remove('wait');
    if (out.ready) showDocs();
  } catch (err) {
    wait.textContent = err.message || 'Something went wrong. Please try again.'; wait.classList.remove('wait');
  } finally {
    chat.busy = false; $('say').focus();
  }
});
// ---- Documents and submission: the same intake API as the full claim form (/api/intakes/submit).
const DOCS = [
  { kind: 'incident_report', label: 'Incident report', required: true },
  { kind: 'itemized_quote', label: 'Itemized repair quote', required: true },
  { kind: 'damage_photo', label: 'Damage photo (optional)', required: false },
];
const MAX_BYTES = 2 * 1024 * 1024;
const files = {};
let docsCard = null, submitted = false;
function hex(bytes) { return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join(''); }
function toBase64(file) {
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(',')[1] || '');
    r.onerror = () => fail(new Error('The file could not be read.'));
    r.readAsDataURL(file);
  });
}
function showDocs() {
  if (docsCard || submitted) return;
  docsCard = node('div', 'docs');
  const err = node('p', 'err'); err.hidden = true;
  const btn = node('button', 'submit', 'Submit claim'); btn.type = 'button'; btn.disabled = true;
  const ready = () => { btn.disabled = !DOCS.every((d) => !d.required || files[d.kind]); };
  docsCard.append(node('h2', '', 'Add your documents'),
    node('p', '', 'We need the incident report and an itemized repair quote. PDF, PNG or JPEG, up to 2 MB each.'));
  for (const d of DOCS) {
    const row = node('label', 'doc'); const input = document.createElement('input');
    input.type = 'file'; input.accept = '.pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg';
    const name = node('span', 'name', 'Choose file');
    row.append(node('span', '', d.label), name, input);
    input.addEventListener('change', async () => {
      const f = input.files && input.files[0]; err.hidden = true;
      if (!f) return;
      if (f.size > MAX_BYTES) { err.textContent = f.name + ' is larger than 2 MB.'; err.hidden = false; return; }
      try {
        files[d.kind] = { kind: d.kind, name: f.name.replace(/[\/\x00-\x1f]/g, '_'), content_base64: await toBase64(f) };
        name.textContent = f.name; row.classList.add('ok'); ready();
      } catch (e) { err.textContent = e.message; err.hidden = false; }
    });
    docsCard.append(row);
  }
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Submitting…'; err.hidden = true;
    const payload = { ...chat.values, request_id: crypto.randomUUID(), notes: {},
      documents: DOCS.map((d) => files[d.kind]).filter(Boolean) };
    try {
      const r = await fetch(API + '/api/intakes/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: hex(crypto.getRandomValues(new Uint8Array(32))), expected_revision: 0,
          evidence_version: 1, payload }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || 'The claim could not be submitted. Please try again.');
      submitted = true; showReceipt(out);
    } catch (e) {
      err.textContent = e.message; err.hidden = false; btn.textContent = 'Submit claim'; ready();
    }
  });
  docsCard.append(err, btn);
  $('thread').append(docsCard);
  $('thread').scrollTop = $('thread').scrollHeight;
}
function showReceipt(out) {
  const card = node('div', 'docs receipt');
  const next = out.evidence && out.evidence.next_action && out.evidence.next_action.message;
  card.append(node('h2', '', 'Claim submitted'), node('p', '', 'Your reference'), node('span', 'ref', out.reference || ''),
    node('p', '', next || 'We have received your claim and documents. The claims team will be in touch by email.'));
  docsCard.replaceWith(card); docsCard = card;
  $('say').disabled = true; $('say').placeholder = 'Claim submitted'; $('send').disabled = true;
  $('thread').scrollTop = $('thread').scrollHeight;
}
$('tab-new').addEventListener('click', () => select('new'));
$('tab-claims').addEventListener('click', () => select('claims'));
select('new');
</script>
</body>
</html>
