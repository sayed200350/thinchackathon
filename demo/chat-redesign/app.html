<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Retakt</title>
<link rel="stylesheet" href="/retakt.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#000;color:var(--foreground);font-family:var(--font-sans)}
.tabs-wrap{display:flex;justify-content:center;padding:12px 12px 8px;flex:none}.tabs{display:flex;padding:3px;border:1px solid var(--border);border-radius:999px;background:var(--card)}
.tab{border:0;background:none;color:var(--muted-foreground);padding:7px 16px;border-radius:999px;font:500 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}.tab[aria-selected=true]{background:var(--primary);color:var(--primary-foreground)}
.view{flex:1;min-height:0;display:none}.view.on{display:flex;flex-direction:column}iframe{width:100%;height:100%;border:0;flex:1;min-height:0;background:#000}
#claims{padding:20px 18px;overflow-y:auto}.eyebrow{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}h1{font-size:28px;font-weight:500;margin:8px 0 18px}.sub{color:var(--muted-foreground);font-size:14px;line-height:1.5}.list{display:grid;gap:10px}.item{display:grid;gap:9px;width:100%;text-align:left;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--card)}.reference{font:500 11px var(--font-mono);overflow-wrap:anywhere}.badge{width:fit-content;white-space:normal;font-size:10px}.empty{margin:18px 0}.claim-section{margin:22px 0 10px;font-size:16px;font-weight:500}.claim-title{font-size:15px;line-height:1.4;margin:0;color:var(--foreground)}.claim-meta{font-size:11px;margin:0;color:var(--muted-foreground);line-height:1.5}.claim-actions{display:flex;flex-wrap:wrap;gap:8px}.claim-actions button,.back-claims{border:1px solid var(--border);border-radius:999px;padding:9px 12px;background:transparent;color:var(--foreground);font-size:12px}.claim-actions .send-claim{background:var(--primary);color:var(--primary-foreground)}.claim-actions button:disabled{opacity:.4;cursor:not-allowed}.badge.draft{color:#edcb88}.badge.sent{color:#86f09f}#claims:has(#claim-detail-wrap:not([hidden])){padding:0;overflow:hidden}#claim-detail-wrap{height:100%;display:flex;flex-direction:column}.back-claims{margin:8px 14px;align-self:flex-start}#claim-detail{flex:1}.view[hidden],#claim-detail-wrap[hidden],#claims-list[hidden]{display:none!important}#claims-list{padding-bottom:75px}.link-form{display:grid;gap:10px;margin-top:24px}.link-form label{font-size:13px}.link-form input{font-size:13px}.error{color:#f89999;font-size:13px}
.rico-dock{position:fixed;z-index:5;right:14px;bottom:14px;display:flex;align-items:center;gap:4px;padding:0 10px 0 0;border:1px solid #86f09f40;border-radius:999px;background:#111e16;color:#d5f9df;box-shadow:0 5px 24px #0009}.rico-dock img{width:56px;height:56px;animation:float 4s ease-in-out infinite}.rico-dock span{font-size:12px;font-weight:500}.rico-dock:hover{background:#182c1e}button:focus-visible{outline:2px solid #86f09f;outline-offset:3px}
dialog{color:var(--foreground);background:#101410;border:1px solid #36563e;border-radius:24px;width:calc(100% - 28px);max-width:390px;max-height:calc(100% - 32px);padding:24px 20px;overflow-y:auto}dialog::backdrop{background:#000c;backdrop-filter:blur(6px)}.call-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;font-size:24px;padding:0 4px;color:#aaa}.call-avatar{display:block;width:126px;height:126px;margin:6px auto;animation:float 4s ease-in-out infinite}.call-avatar.speaking{animation:talk .65s ease-in-out infinite}.call-title{text-align:center;font-size:25px;margin:0 0 6px}.call-state{text-align:center;color:#a9dcb6;font-size:13px;margin:0 0 16px}.call-copy{text-align:center;font-size:13px;line-height:1.6;color:#aaa}.call-actions{display:grid;gap:10px;margin:18px 0 10px}.call-actions button{min-height:44px;border-radius:999px}.start-call{background:#86f09f;border:1px solid #86f09f;color:#102716;font-weight:500}.end-call{background:#442225;border:1px solid #915057;color:#ffd7dc}.secondary{border:1px solid #444;background:transparent;color:#eee}.live-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.call-facts{display:grid;grid-template-columns:90px minmax(0,1fr);gap:7px 10px;font-size:13px;margin:16px 0;padding:14px;background:#ffffff07;border-radius:12px}.call-facts dt{color:#a8b4ab}.call-facts dd{margin:0;overflow-wrap:anywhere}.transcript-panel{margin-top:14px;font-size:12px;color:#a8b4ab}.transcript-panel summary{cursor:pointer;padding:8px 0}.transcript{max-height:130px;overflow-y:auto;display:grid;gap:8px;margin:14px 0}.transcript p{font-size:13px;line-height:1.5;padding:10px;border-radius:10px;background:#1d251e;margin:0}.transcript .user{background:#242424}.call-error{color:#f7a8a8;font-size:13px;line-height:1.5}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@keyframes float{50%{transform:translateY(-4px) rotate(3deg)}}@keyframes talk{50%{transform:scale(1.06,.96)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-voice-agent="agent_3901m6x8v449ezja43kkakqwdcep">
<div class="tabs-wrap"><nav class="tabs" role="tablist" aria-label="Retakt"><button class="tab" role="tab" aria-controls="new" id="tab-new" aria-selected="true" type="button">New claim</button><button class="tab" role="tab" aria-controls="claims" id="tab-claims" aria-selected="false" type="button">My claims</button></nav></div>
<section class="view on" id="new" role="tabpanel" aria-labelledby="tab-new"><iframe id="claim-flow" src="/chat?start=chat&embedded=1" title="Report a claim — chat and documents" allow="clipboard-write; camera; microphone; autoplay"></iframe></section>
<section class="view" id="claims" role="tabpanel" aria-labelledby="tab-claims"><div id="claims-list"></div><div id="claim-detail-wrap" hidden><button class="back-claims" id="back-claims" type="button">← My claims</button><iframe id="claim-detail" title="Your recorded claim" allow="clipboard-write; camera; microphone; autoplay"></iframe></div></section>
<button class="rico-dock" id="rico" type="button" aria-label="Call Rico, your claims assistant" aria-haspopup="dialog"><img src="/rico.svg" alt=""><span>Call Rico</span></button>
<dialog id="call" aria-labelledby="call-title"><div class="call-head"><span class="eyebrow">Retakt · voice call</span><button class="close" id="close-call" aria-label="Close call" type="button">×</button></div><img class="call-avatar" id="call-avatar" src="/rico.svg" alt="Rico, the green Retakt mascot"><h2 class="call-title" id="call-title">Talk to Rico</h2><p class="call-state" id="call-state" role="status">Your claims assistant</p><p class="call-copy sr" id="call-copy" role="status"></p><dl class="call-facts" id="call-facts" aria-label="Your details" hidden></dl><details class="transcript-panel" id="transcript-panel" hidden><summary>Transcript</summary><div class="transcript" id="transcript" role="log" aria-label="Call transcript" aria-live="off"></div></details><p class="call-error" id="call-error" role="alert" hidden></p><div class="call-actions"><button class="start-call" id="start-call" type="button">Start call</button><div class="live-controls" id="live-controls" hidden><button class="secondary" id="mute-call" type="button" aria-pressed="false">Mute</button><button class="end-call" id="end-call" type="button" hidden>End call</button></div><button class="secondary" id="use-chat" type="button">Continue in chat</button></div></dialog>
<script src="/profile.js"></script>
<script type="module" src="/client.js"></script>
</body>
</html>
